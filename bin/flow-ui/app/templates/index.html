<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vschk-flow-ui</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>

  {% if is_demo_active %}
  <div class="demo-banner" style="background:#fef3c7;border-bottom:2px solid #f59e0b;padding:8px 16px;font-size:13px;color:#78350f;text-align:center;">
    ⚠️ <strong>Demo mode</strong> — sample projects loaded for exploration.
    Your real data is untouched. To remove:
    <code style="background:#fbbf24;padding:1px 6px;border-radius:3px;">bash bin/archive-demo</code>
  </div>
  {% endif %}

  <header class="topbar">
    <div class="logo">flow<span class="dot">·</span>ui</div>
    <select id="project-selector" aria-label="Project"></select>
    <div class="stats-badge" title="Open global statistics">
      <span class="badge-label">Statistics</span>
      <span class="today">· {{ stats.today_count }} today</span>
    </div>
    <div class="locale-switcher" aria-label="Language">
      <button class="locale-btn" data-locale="en">EN</button>
      <span class="locale-sep">|</span>
      <button class="locale-btn" data-locale="ru">RU</button>
    </div>
  </header>

  <main class="split">
    <aside class="left-panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="files" role="tab">Files</button>
        <button class="tab" data-tab="tasks" role="tab">Tasks</button>
        <button class="tab" data-tab="deploys" role="tab">Deploys</button>
        <button class="tab" data-tab="skills" role="tab">Skills</button>
      </div>
      <div class="crumbs" id="crumbs"></div>
      <div id="tree" class="tree">
        <div class="muted">Loading…</div>
      </div>
    </aside>

    <section class="right-panel">
      <div id="content" class="content">
        <div class="muted center">Select a file or artifact on the left.</div>
      </div>
    </section>
  </main>

</body>
</html>
