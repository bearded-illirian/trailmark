<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задачи</title>
  <link rel="stylesheet" href="/static/themes/saffron-graphite.css">
  <link rel="stylesheet" href="/static/kits/task-engine/task-engine.css">
  <script src="/static/sandbox-frame.js"></script>
  <script src="/static/kits/task-engine/task-engine.js" defer></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .shell { max-width: 1100px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="shell">
    <main id="task-engine-root"></main>
  </div>
  <script>
    // Consumer-provided glue-code для standalone режима.
    // Пример — заменяется реальным при интеграции в конкретный consumer.
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.TASK_ENGINE_CONFIG) {
        document.getElementById("task-engine-root").innerHTML =
          '<div class="te-error">TASK_ENGINE_CONFIG не задан. Добавь inline script перед mount.</div>';
        return;
      }
      window.TaskEngine.mount(document.getElementById("task-engine-root"), window.TASK_ENGINE_CONFIG);
    });
  </script>
</body>
</html>
