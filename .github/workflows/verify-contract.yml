name: Verify SKILL contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    name: Lint every SKILL.md against docs/SKILL_CONTRACT.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run verify-contract.sh
        run: bash bin/verify-contract.sh

      # The Codex adapter tree under adapters/ is generated from the skills,
      # not maintained by hand. Committing it keeps the port browsable and
      # usable where the bash generator cannot run (see issue #2), but a
      # committed build output drifts unless something checks. A hand edit
      # there would otherwise survive until the next rebuild and then vanish
      # without a trace — the loudest place to catch that is here.
      - name: Verify every adapter tree is current
        run: bash bin/build-adapter.sh all --check

      - name: Verify manifest.yml is parseable
        run: |
          python3 -c "
          import yaml
          d = yaml.safe_load(open('manifest.yml'))
          assert d['meta']['version'], 'meta.version missing'
          assert len(d['entries']) > 0, 'no entries'
          print(f'manifest.yml valid: v{d[\"meta\"][\"version\"]} - {len(d[\"entries\"])} entries')
          "
