name: Bug report
description: Something in Trailmark isn't behaving as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as
        much of the following as you can — the more specific, the faster
        we can diagnose.

        For security vulnerabilities, please use the private channel in
        [SECURITY.md](../blob/main/SECURITY.md), not this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A concise description of the unexpected behavior.
      placeholder: "e.g. `bash bin/init` failed with error XYZ on macOS 14.3"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce locally.
      placeholder: |
        1. Clone at commit XYZ
        2. Run `bash bin/init`
        3. Enter "abc" at the aihub_root prompt
        4. Observe error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Trailmark version / commit
      description: Output of `git rev-parse --short HEAD` or the release tag.
      placeholder: "v0.8.0 or a3f8c1d"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - WSL (Windows Subsystem for Linux)
        - Other
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment details
      description: Output of `bash --version`, `python3 --version`, `sqlite3 --version`.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste any relevant output. Wrap in triple backticks.
      render: shell
    validations:
      required: false
