name: Feature request
description: Suggest a concrete enhancement to the framework.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature issue, consider whether the idea fits
        better as a [Discussion in the Ideas category](../../discussions/categories/ideas)
        — that's the right place for open-ended proposals. Issues are for
        concrete, actionable enhancements you're ready to help scope.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: Describe the current pain point — what makes the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see happen. Be specific — file names, command shape, expected output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you weighed. Why is the proposed one better?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the framework does this touch?
      options:
        - Skill (protocol, core, or command)
        - Tooling (bin/ scripts)
        - Flow UI
        - Documentation
        - CI / release process
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: Would you help implement this?
      options:
        - label: I'm willing to open a PR for this.
          required: false
