# ── Publish allowlist ─────────────────────────────────────────────────────
# What bin/sync-to-github.sh is allowed to publish, by top-level path.
#
# This is a WHITELIST on purpose. The exclude lists above are blacklists, and a
# blacklist protects only against what its author remembered on the day it was
# written: three directories that appeared in the live Flow UI tree after July
# rode the next sync straight into the public mirror, silently, because nobody
# went back to the list. A whitelist inverts the default — something new is not
# published until someone says so.
#
# The gate compares this list against the actual tree and refuses in BOTH
# directions:
#   - a path in the tree that is not listed  → something new would be published
#   - a path listed that is not in the tree  → the list has drifted from reality
# The second is not a leak, but left unchecked it turns into a quiet deletion:
# rsync --delete removes from the mirror whatever the list stops covering.
#
# Top level only. A leak arrives as a directory, and a 285-line file list is one
# nobody maintains.
publish_allowlist:
  - .github
  - .gitignore
  - adapters
  - aihub
  - bin
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - docs
  - FAQ.md
  - FAQ.ru.md
  - fixtures
  - framework.yml.example
  - LICENSE
  - manifest.yml
  - projects
  - README.md
  - README.ru.md
  - SECURITY.md
  - tasks

# ── Generated outputs ─────────────────────────────────────────────────────
# Trees produced by a generator from the entries above. They are committed —
# the port has to stay browsable, and the bash generator cannot run on every
# platform (see issue #2) — but they are OUTPUT, never a source.
#
# Editing a file inside one of these paths does not survive the next rebuild.
# Change the skill in aihub/ or the generator itself, then rebuild.
#
# Drift is enforced against, not merely discouraged:
#   - .github/workflows/verify-contract.yml runs --check on push and PR
#   - bin/sync-to-github.sh refuses to publish a tree that has drifted

outputs:

  - id: codex-adapter
    path: adapters/codex/.agents/skills/
    generated_by: bin/build-adapter.sh codex
    verify: bash bin/build-adapter.sh codex --check
    source: aihub/.claude/skills/ + aihub/.claude/commands/
    note: |
      Claude-shaped skills rewritten for Codex — Skill('x') becomes $x,
      .claude/skills becomes .agents/skills. Bodies are otherwise untouched.
      Carries files the source has no equivalent for: agents/openai.yaml
      invocation policies and GENERATED.md.

  - id: cursor-adapter
    path: adapters/cursor/.cursor/skills/
    generated_by: bin/build-adapter.sh cursor
    verify: bash bin/build-adapter.sh cursor --check
    source: aihub/.claude/skills/ + aihub/.claude/commands/
    note: |
      The same skills rewritten for Cursor — Skill('x') becomes /x,
      .claude/skills becomes .cursor/skills. Bodies are otherwise untouched.
      Implicit invocation is forbidden through a frontmatter key rather than
      a sidecar file: Cursor reads disable-model-invocation from the skill's
      own frontmatter, while Codex accepts only name and description there.
      That difference is why the two runtimes need two trees.

  # Every tree above is checked in one call:
  #   bash bin/build-adapter.sh all --check
  # Both CI and bin/sync-to-github.sh use that form — asking per runtime is
  # how one runtime eventually goes unchecked.

