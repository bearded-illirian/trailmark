# Public release manifest for Trailmark — the artifact-first agent framework.
# Whitelist of skills and commands to sync from aihub → framework-public.
# Consumed by bin/sync-from-aihub.sh.
#
# Editing policy:
#   - Add/remove entries → bump `meta.version` (semver)
#   - Update `last_synced_commit` — only via sync-from-aihub.sh, not by hand
#   - Change `sync_rules` → re-run full sync + review diff

meta:
  version: 0.8.0
  description: |
    v0.8.0 — Onboarding closure: added `tutorial-check` core skill —
    homework validator that runs 5 SQL/file checks against user's
    workspace after they complete the QUICKSTART § 5 walkthrough.
    Read-only; reports ✅/❌ per step with remediation hints. Ships
    with SKILL.md + SKILL.public.md + INFO.md + INFO.public.md.
    Manifest grew from 19 to 20 entries (13 core skills now).
    Complements bin/init-demo + bin/archive-demo demo lifecycle.

    v0.7.0 — INFO.md extension: 16 EN INFO.md files (frontmatter + pitch +
    4 sections) shipped alongside every SKILL.md. Added `INFO.public.md`
    → `INFO.md` rename pattern to `bin/sync-from-aihub.sh` (parallel to
    SKILL pattern). Added `INFO.md` to `sync_rules.exclude_patterns` so
    internal RU INFO.md source is not synced. Extended `skill-public-check`
    with `target_file` parameter and v2.1 `info` profile (skips C8/C10 —
    INFO is descriptive, not a protocol). Two new INFO.md created for
    `cadence-first` and `decision-first` (previously without INFO).

    v0.6.0 — MVP extension +4 skills: `cadence-first` (meta-orchestrator
    assigning Tier 1/2/3 per block), `arch-map` (auto-link artifact ↔
    architecture elements), `check-first` (coverage validation before
    approval), `go-guide` (add conceptual guide, with ship-first hook).
    Manifest grew from 15 to 19 entries. All 4 shipped with adapted
    SKILL.public.md (0 VSCHK refs, fallback-only for go-guide).

    v0.5.0 — added `tool` tier for executable code trees synced from external
    repos (first consumer: Flow UI). Tools bypass the SKILL.public.md rename
    loop and use per-tool exclude_patterns (see sync_rules.tool_exclude_patterns).
    Entry may set `source_root: external` to resolve source_path outside
    `$AIHUB_ROOT/.claude/` — the sync script then uses expanduser() on
    source_path directly. Backward-compatible with v0.4.0 entries (no source_root
    field → defaults to aihub).

    v0.4.0 — BREAKING layout change: restructured to vasechka-workspace layout.
    All skills now live under `aihub/.claude/skills/{name}/` (flat, no tier
    subdirs). Commands under `aihub/.claude/commands/`. Top-level:
    aihub/ (central skill registry), projects/ (user's projects), tasks/
    (unified routing.db + logs), bin/ (workspace tooling), docs/.

    Prior v0.3.1 shipped 14 items with flat top-level core/protocols/commands
    layout — now consolidated under aihub/.claude/ for consumer symlink pattern.

    Public exports produced by skill-public-make and validated by
    skill-public-check v2.0. Framework consumers get sanitized versions with
    zero leaks. Sync-script renames *.public.md → canonical name on destination.

    v0.5.0 release — 15 items (2 commands + 4 protocol skills + 8 core skills + 1 tool).
    v0.6.0 release — 19 items (2 commands + 4 protocol skills + 12 core skills + 1 tool).
    v0.7.0 release — same 19 items + 16 EN INFO.md descriptions (no manifest count change,
    per-item metadata layer added).
    v0.8.0 release — 20 items (2 commands + 4 protocol skills + 13 core skills + 1 tool).
  updated_at: 2026-07-18

source:
  repo: aihub
  # base_path is documentation-only — bin/sync-from-aihub.sh auto-detects
  # AIHUB_ROOT via ENV override → workspace/aihub subdir → $HOME/Projects/aihub fallback.
  base_path: "${AIHUB_ROOT}/.claude"

destination:
  # base_path is documentation-only — bin/sync-from-aihub.sh derives from
  # SCRIPT_DIR/.. (script's parent directory).
  base_path: "${FRAMEWORK_PUBLIC_ROOT}"

sync_rules:
  # When source_path is a directory, these patterns are excluded from the copy.
  exclude_patterns:
    - "SKILL.md"         # Internal working version — often RU or with project refs
    - "SKILL.eng.md"     # EN staging translation — pre-public
    - "SKILL.ru.md"      # Russian language variants
    - "INFO.md"          # Internal RU metadata — INFO.public.md is the shipped EN version
    - "*.next.md"        # WIP staging drafts (SKILL.next.md)
    - "*.bak-*"          # Backup files from task blocks
    - "domains/"         # Per-domain configs — vschk-specific
    - ".DS_Store"

  # Explicit include hints for the sync-script (documentation of intent).
  include_patterns:
    - "SKILL.public.md"  # Primary source — v2.0 checker-validated public export
    - "INFO.md"          # Optional metadata (frontmatter-only file, when present)

  # Per-tool exclude patterns applied ONLY to entries with `tier: tool`.
  # Skills/commands use the exclude_patterns block above; tools use these.
  # Rationale: tool source trees have different noise (venv, logs, __pycache__,
  # local config) than skill markdown trees.
  tool_exclude_patterns:
    - "app/auth.py"      # VSCHK-specific SSO reference; contract in AUTH.md
    - "config.yml"       # per-user local config (gitignored upstream)
    - "config.vds.yml"   # upstream-specific VDS deploy config
    - ".git"
    - "venv"
    - ".venv"
    - "logs"
    - "__pycache__"
    - "*.pyc"
    - ".env"
    - "*.key"
    - "*.bak-*"
    - ".DS_Store"
    # Content and runtime state of the live app — never part of the framework.
    # These appeared in the working tree AFTER this list was written (partner-content
    # 22 Jul, data 31 Jul, external-shares 5 Aug) and rode the next sync into the
    # public mirror. A blacklist only protects against what its author thought of;
    # bin/sync-to-github.sh carries the whitelist that catches the rest.
    - partner-content
    - external-shares
    - data/external_shares.db

