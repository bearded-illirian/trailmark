# Public release manifest for the VSCHK Framework.
# Whitelist of skills and commands to sync from aihub → framework-public.
# Consumed by bin/sync-from-aihub.sh (Block 3 of task aihub--498-vschk-framework).
#
# Editing policy:
#   - Add/remove entries → bump `meta.version` (semver)
#   - Update `last_synced_commit` — only via sync-from-aihub.sh, not by hand
#   - Change `sync_rules` → re-run full sync + review diff

meta:
  version: 0.3.1
  description: |
    v0.3.1 — dev-auto-first added as 14th skill (autonomous per-block
    orchestrator). SKILL.public.md v1.0 PASS 100/100 via skill-public-check v2.0.
    Prior v0.3.0 shipped 13 items with contract sections + go-fast.public.md.

    Public exports produced by skill-public-make and validated by
    skill-public-check v2.0 (10 boolean checks + 8-dimension scoring).
    Framework consumers get sanitized versions with zero leaks (D1-D6 critical
    dims). Sync-script renames *.public.md → canonical name on destination.

    MVP release — 14 items (2 commands + 4 protocol skills + 8 core skills).
  updated_at: 2026-07-17

source:
  repo: aihub
  base_path: /Users/viktor/Projects/aihub/.claude

destination:
  base_path: /Users/viktor/Projects/vschk-platform/framework-public

sync_rules:
  # When source_path is a directory, these patterns are excluded from the copy.
  # v0.2.0: skip internal variants — only public exports pass through.
  exclude_patterns:
    - "SKILL.md"         # Internal working version — often RU or with project refs
    - "SKILL.eng.md"     # EN staging translation — pre-public
    - "SKILL.ru.md"      # Russian language variants
    - "*.next.md"        # WIP staging drafts (SKILL.next.md)
    - "*.bak-*"          # Backup files from task blocks
    - "domains/"         # Per-domain configs — vschk-specific
    - ".DS_Store"

  # Explicit include hints for the sync-script (documentation of intent).
  # v0.2.0: SKILL.public.md is the sanitized public export; sync-script renames it to SKILL.md on destination.
  include_patterns:
    - "SKILL.public.md"  # Primary source — v2.0 checker-validated public export
    - "INFO.md"          # Optional metadata (frontmatter-only file, when present)

